<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<title>Owner trips and manifest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0b6b75}a:hover{color:#10303a}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #fbf6ec; font-family: Figtree, system-ui, sans-serif; color: #10303a">
  <div style="padding: 20px 16px 0; display: flex; justify-content: space-between; align-items: flex-end">
    <div>
      <span style="font-size: 13px; font-weight: 600; color: #56676a">Bangka Tala · Kuya Ramon</span>
      <h1 style="margin: 2px 0 0; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 26px; line-height: 30px; font-weight: 800; letter-spacing: -0.3px">Mga trip ngayong linggo</h1>
    </div>
  </div>

  <section style="margin: 16px 16px 0; background: #ffffff; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(16,48,58,0.08), 0 6px 16px rgba(16,48,58,0.08)">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
      <div>
        <b style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 20px">Sab 14 Nov, 5:00 AM</b>
        <div style="font-size: 14px; color: #56676a">Group jigging · 5 of 8 seats booked</div>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; padding: 4px 10px 4px 8px; border-radius: 999px; background: #d6edec; color: #0b6b75; white-space: nowrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0b6b75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        Pwede pumalaot
      </span>
    </div>
    <div style="height: 10px; border-radius: 999px; background: #f2e9d8; overflow: hidden" role="img" aria-label="5 of 8 seats booked"><div style="width: 62.5%; height: 100%; background: #0b6b75"></div></div>

    <b style="font-size: 15px; margin-top: 4px">Manifest</b>
    <div style="display: flex; flex-direction: column">
      <label style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #e3d7c3; min-height: 32px">
        <input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: #0b6b75">
        <span style="flex: 1; font-size: 15px">Jun D. <span style="color: #56676a">· 2 seats</span></span>
        <span style="font-size: 13px; color: #56676a">₱700 sa bangka</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #e3d7c3; min-height: 32px">
        <input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #0b6b75">
        <span style="flex: 1; font-size: 15px">Marites A. <span style="color: #56676a">· 1 seat</span></span>
        <span style="font-size: 13px; color: #56676a">₱350 sa bangka</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 8px 0; min-height: 32px">
        <input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #0b6b75">
        <span style="flex: 1; font-size: 15px">Paolo R. <span style="color: #56676a">· 2 seats</span></span>
        <span style="font-size: 13px; color: #56676a">₱700 sa bangka</span>
      </label>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #e3d7c3; padding-top: 10px">
      <span style="font-size: 14px; color: #56676a">Kokolektahin sa bangka</span>
      <b style="font-size: 20px; font-variant-numeric: tabular-nums">₱1,750</b>
    </div>
  </section>

  <section style="margin: 12px 16px 0; background: #ffffff; border-radius: 22px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center">
    <div>
      <b style="font-size: 16px">Lin 15 Nov, 5:00 AM</b>
      <div style="font-size: 14px; color: #56676a">Whole boat · group of 4 · ₱2,500 sa bangka</div>
    </div>
    <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; padding: 4px 10px 4px 8px; border-radius: 999px; background: #fdebc8; color: #8f5300; white-space: nowrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8f5300" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"></path><path d="M12 10v4.5"></path></svg>
      Mag ingat
    </span>
  </section>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 20px; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 56px; border-radius: 22px; border: 0; background: #f5a524; color: #10303a; font: inherit; font-size: 17px; font-weight: 700">Send manifest to Coast Guard</button>
    <button type="button" style="height: 48px; border-radius: 14px; border: 1.5px solid #8c7e68; background: #ffffff; color: #10303a; font: inherit; font-size: 15px; font-weight: 700">Open a new group trip</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
