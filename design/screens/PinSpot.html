<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<title>Pin a spot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0b6b75}a:hover{color:#10303a}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #fbf6ec; font-family: Figtree, system-ui, sans-serif; color: #10303a">
  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px">
    <a href="Main.dc.html" aria-label="Close" style="width: 48px; height: 48px; display: grid; place-items: center; border-radius: 999px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10303a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 20px; line-height: 26px; font-weight: 700">Pin this spot</h1>
  </div>

  <div style="margin: 0 16px; height: 128px; border-radius: 22px; overflow: hidden; position: relative; background: #bfe1e0">
    <svg width="358" height="128" viewBox="0 0 358 128" aria-hidden="true" style="position: absolute; left: 0; top: 0">
      <path d="M0 0 H358 V48 C300 60 260 92 200 84 C140 76 90 40 0 58 Z" fill="#f2e9d8" stroke="#e3d7c3" stroke-width="2"></path>
    </svg>
    <div style="position: absolute; left: 163px; top: 46px; width: 32px; height: 32px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); background: #f5a524; border: 2.5px solid #ffffff"></div>
    <span style="position: absolute; right: 10px; bottom: 10px; font-size: 12px; font-weight: 600; background: #ffffff; padding: 3px 9px; border-radius: 999px">Drag the map to adjust</span>
  </div>

  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 16px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">
      Pangalan ng spot
      <input type="text" value="Lucanin rocks, north side" style="height: 48px; border-radius: 8px; border: 1.5px solid #8c7e68; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; font-weight: 400; color: #10303a">
    </label>

    <div style="display: flex; gap: 8px; align-items: center">
      <div style="width: 72px; height: 72px; border-radius: 14px; background: #0b6b75"></div>
      <div style="width: 72px; height: 72px; border-radius: 14px; background: #f5a524"></div>
      <button type="button" aria-label="Add photo" style="width: 72px; height: 72px; border-radius: 14px; border: 1.5px dashed #8c7e68; background: #f2e9d8; display: grid; place-items: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10303a" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg>
      </button>
      <span style="font-size: 13px; color: #56676a; margin-left: 4px">Location data removed from photos</span>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 20px; line-height: 26px; font-weight: 700; padding: 0; margin-bottom: 8px">Sino ang makakakita?</legend>
      <label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: #ffffff; border: 1.5px solid #e3d7c3">
        <input type="radio" name="vis" style="margin: 3px 0 0; width: 20px; height: 20px; accent-color: #0b6b75">
        <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px">Only you</b><span style="font-size: 14px; color: #56676a">Your secret spot. Nobody else sees it.</span></span>
      </label>
      <label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: #ffffff; border: 1.5px solid #e3d7c3">
        <input type="radio" name="vis" style="margin: 3px 0 0; width: 20px; height: 20px; accent-color: #0b6b75">
        <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px">Followers</b><span style="font-size: 14px; color: #56676a">Your barkada sees the exact pin.</span></span>
      </label>
      <label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: #d6edec; border: 2px solid #0b6b75">
        <input type="radio" name="vis" checked style="margin: 3px 0 0; width: 20px; height: 20px; accent-color: #0b6b75">
        <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px">Everyone, approximate area</b><span style="font-size: 14px; color: #10303a">Others see a circle about 1 km wide, never the exact point.</span></span>
      </label>
    </fieldset>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: #ffffff; box-shadow: 0 -8px 24px rgba(16,48,58,0.12)">
    <button type="button" style="width: 100%; height: 56px; border-radius: 22px; border: 0; background: #f5a524; color: #10303a; font: inherit; font-size: 17px; font-weight: 700">Pin this spot</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
